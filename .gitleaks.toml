# gitleaks (public CI, version pinned in .github/workflows/ci.yml): the default rules, minus the fixtures of the
# credential masking tests — fake values by design, there so the tests can prove these formats are caught. A finding
# is allowed only when BOTH hold: it is in one of these test files AND it is one of the known fakes. A real secret
# pasted into the same files is still reported.
[extend]
useDefault = true

[[allowlists]]
description = "known fake credentials in the masking tests"
condition = "AND"
paths = [
  '''^core/privacy/privacy_test\.go$''',
  '''^core/privacy/spec_test\.go$''',
  '''^core/api/executor_gate_test\.go$''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0''', # the jwt.io sample token (sub 1234567890)
  '''AKIAABCDEFGHIJKLMNOP''',
  '''b3BlbnNzaC1rZXk=''', # base64 of "openssh-key": a truncated key header
  '''abc123def456''',
  '''a1b2c3d4e5f6''',
  '''AIzaTestKey0123456789''',
]
